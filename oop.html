<script>
const topics = [
    // --- VARIANTA E ---
    {
        author: "varianta_e",
        title: "1. Rozdíl mezi virtuální a čistě virtuální třídou (metodou)",
        points: [
            "**Virtuální metoda:** Definuje se klíčovým slovem <code>virtual</code>. Má v rodiči svou vlastní (výchozí) implementaci, ale umožňuje potomkům tuto metodu překrýt a změnit tak její chování. Tím se realizuje polymorfismus.",
            "**Čistě virtuální metoda:** Zapisuje se s <code>= 0</code> na konci deklarace (např. <code>virtual void m() = 0;</code>). Nemá žádnou implementaci v nadřazené třídě. Vynucuje, aby potomek tuto metodu povinně implementoval.",
            "**Rozdíl ve třídách:** Jakmile třída obsahuje alespoň jednu čistě virtuální metodu, stává se z ní tzv. **abstraktní třída** a nelze z ní přímo vytvářet instance. Pojem 'čistě virtuální třída' se v C++ neoficiálně používá pro čistě abstraktní třídy (rozhraní / interfaces), které neobsahují nic jiného než čistě virtuální metody a virtuální destruktor."
        ],
        tip: "Klíčový rozdíl je v povinnosti a abstrakci. Běžnou virtuální metodu potomek překrýt MŮŽE, čistě virtuální překrýt MUSÍ (pokud z něj chceme vytvářet instance)."
    },
    {
        author: "varianta_e",
        title: "2. Jaký je rozdíl mezi přetížením a překrytím? Druhy překrytí.",
        points: [
            "**Přetížení (Overloading):** Definování více metod se *stejným jménem* v rámci jedné třídy, které se ale liší počtem nebo datovým typem parametrů (signaturou). Řeší se staticky už během překladu kódu kompilátorem.",
            "**Překrytí (Overriding):** Potomek nahrazuje chování (metodu) rodiče. Překrývající metoda v potomkovi musí mít naprosto *identické jméno i signaturu* (parametry) jako metoda v rodiči.",
            "**Druhy překrytí:**<br>1) <em>Obyčejné překrytí (Shadowing/Skrytí):</em> Metoda v rodiči není virtuální. Funguje zde statická vazba – zavolá se verze metody podle typu ukazatele, nikoliv reálného objektu.<br>2) <em>Polymorfní překrytí:</em> Metoda v rodiči je <code>virtual</code>. Funguje zde dynamická vazba – díky tabulce VTable se za běhu programu zavolá překrytá metoda podle skutečného typu objektu vytvořeného v paměti."
        ],
        tip: "Nejčastějším příkladem přetížení jsou konstruktory – jedna třída může mít bezparametrický, s jedním parametrem, se dvěma atd."
    },
    {
        author: "varianta_e",
        title: "3. Statická a dynamická deklarace objektu - rozdíly",
        points: [
            "**Statická deklarace (alokace na zásobníku):** Objekt se alokuje při své definici (např. <code>Trida objekt;</code>). Jeho životnost je striktně omezena platností bloku, ve kterém byl vytvořen (např. tělo funkce). Destruktor je zavolán zcela automaticky po opuštění tohoto bloku.",
            "**Dynamická deklarace (alokace na haldě):** Objekt vzniká ručně za běhu programu pomocí operátoru <code>new</code>, který vrací ukazatel na nově vzniklý objekt (např. <code>Trida* objekt = new Trida();</code>).",
            "U dynamické deklarace má správu paměti na starosti programátor. Životnost objektu není omezena blokem, ale objekt v paměti zůstává, dokud není explicitně smazán voláním <code>delete objekt;</code>. Pokud to programátor neudělá, dojde k úniku paměti (memory leak)."
        ],
        tip: "Ke staticky deklarovaným objektům se přistupuje tečkovou konvencí (obj.metoda()), k dynamickým přes ukazatel operátorem šipky (obj->metoda())."
    },
    {
        author: "varianta_e",
        title: "4. [Kód] Třída se 3 konstruktory, abstraktní třída a dědičnost",
        points: [
            "<strong>Třída se 3 konstruktory a 2 atributy:</strong><br><pre><code>class A {\nprivate:\n  int x;\n  double y;\npublic:\n  A();               // 1. Bezparametrický\n  A(int x);          // 2. Konverzní\n  A(int x, double y); // 3. Úplný\n  ~A();              // Destruktor\n};\n\n// Definice jednoho konstruktoru:\nA::A(int x, double y) {\n  this->x = x;\n  this->y = y;\n}</code></pre>",
            "<strong>Čistě abstraktní třída s potomkem (instance možná):</strong><br><pre><code>class Abst {\npublic:\n  virtual void m1() = 0; // čistě virtuální\n  virtual void m2() = 0; // čistě virtuální\n  virtual ~Abst() {}\n};\n\nclass Potomek : public Abst {\npublic:\n  void m1() override { /* tělo */ }\n  void m2() override { /* tělo */ }\n};\n// Volání: Potomek p; </code></pre>"
        ],
        tip: "Když definujete konstruktor vně třídy, nezapomeňte na operátor rozlišení oboru viditelnosti (::)."
    },

    {

        title: "3. Tabulka virtuálních metod (VTable) a k čemu je",
        points: [
            "Tabulka virtuálních metod (VTable) je skrytá statická struktura (pole), kterou kompilátor automaticky generuje pro každou třídu obsahující alespoň jednu virtuální metodu.",

        ],
        tip: "Pokud by VTable neexistovala, adresa volané metody by se zjišťovala fixně hned při kompilaci podle typu ukazatele (časná vazba), což by znemožnilo polymorfní chování."
    },

            "<strong>Čistě abstraktní třída A a neabstraktní potomci B, C:</strong><br><pre><code>class A {\npublic:\n  virtual void M1() = 0;\n  virtual void M2() = 0;\n};\nclass B : public A {\npublic:\n  void M1() override { }\n  void M2() override { }\n};\nclass C : public A {\npublic:\n  void M1() override { }\n  void M2() override { }\n};</code></pre>"

    // --- VARIANTA B ---

            "Zapuzdrenie (Encapsulation) spája dáta (atribúty) a kód (metódy) do jedného celku (triedy) a chráni vnútro objektu pred neoprávneným zásahom zvonku.",
            "Prístup sa riadi pomocou kľúčových slov:<br><code>private:</code> Dáta sú skryté a dostupné iba metódam samotnej triedy.<br><code>protected:</code> Prístupné pre danú triedu a jej dedičov.<br><code>public:</code> Verejné rozhranie, cez ktoré vonkajší svet s objektom komunikuje (gettery/settery)."
        ],
        tip: "Umožňuje meniť vnútornú implementáciu triedy bez toho, aby sme rozbili kód, ktorý ju zvonku používa."
    },
    {
        author: "neznama_varianta",
        title: "2. Kedy a preco sa pouziva konstruktor a destruktor",
        points: [
            "**Konstruktor:** Používa sa **vždy pri vzniku objektu** (či už statickom na stohu, alebo dynamickom na halde). Používa sa **preto**, aby sa inicializovali hodnoty atribútov a bezpečne sa pripravil objekt na prevádzku.",
            "**Destruktor:** Používa sa **pri zániku objektu** (opustenie bloku validity alebo volanie `delete`). Používa sa **preto**, aby sa uvoľnila dynamicky alokovaná pamäť, zatvorili otvorené súbory či uvoľnili iné systémové prostriedky, čím sa zabráni memory leakom."
        ],
        tip: "Destruktor triedy, z ktorej sa bude dotiť, musí byť označený ako `virtual`, inak pri mazaní cez ukazovateľ na rodiča nedôjde k vyvolaniu deštruktora potomka."
    },
    {
        author: "neznama_varianta",
        title: "3. Rozdiel medzi virtualnou a cisto virtualnou metodou",
        points: [
            "**Virtuálna metóda (virtual):** Má v rodičovskej triede definované základné telo (implementáciu). Potomok ju môže, ale nemusí prepísať (prepísať chovanie).",
            "**Čisto virtuálna metóda (virtual ... = 0):** Nemá v rodičovskej triede žiadne telo. Potomok ju **musí povinne implementovať**, inak z neho nebude možné vytvoriť inštanciu a zostane taktiež abstraktný."
        ],
        tip: "Trieda obsahujúca aspoň jednu čisto virtuálnu metódu sa stáva abstraktnou triedou a slúži ako predpis rozhrania."
    },
    {
        author: "neznama_varianta",
        title: "4. [Kód] Trieda A s dvoma metódami a trieda B, ktorá z nej dedí",
        points: [
            "<strong>Implementácia jednoduchej dedičnosti v C++:</strong><br><pre><code>class A {\npublic:\n  void metoda1() { /* kód */ }\n  void metoda2() { /* kód */ }\n};\n\n// Trieda B dedí verejne z triedy A\nclass B : public A {\npublic:\n  void metodaTreti() { /* špecifická metóda pre B */ }\n};</code></pre>"
        ],
        tip: "Vďaka verejnej dedičnosti (`public A`) má inštancia triedy B prístup k `metoda1()` aj `metoda2()` zdedenej z áčka."
    },
    {
        author: "neznama_varianta",
        title: "5. [Kód] Trieda A obsahujúca dynamicky alokované pole prvkov triedy B",
        points: [
            "<strong>Dynamická alokácia poľa objektov na halde v konštruktore:</strong><br><pre><code>class B {\npublic:\n  B() { /* Vyžaduje sa predvolený konštruktor pre pole */ }\n};\n\nclass A {\nprivate:\n  B* poleB;      // Ukazovateľ na pole objektov\n  int kapacita;\npublic:\n  A(int velkost) {\n    kapacita = velkost;\n    poleB = new B[kapacita]; // Dynamická alokácia\n  }\n  ~A() {\n    delete[] poleB; // POVINNÉ uvoľnenie poľa pomocou delete[]\n  }\n};</code></pre>"
        ],
        tip: "Nezabúdajte na hranaté zátvorky `delete[]`. Ak by ste použili iba `delete poleB;`, uvoľní sa iba prvý objekt v poli a zvyšok spôsobí memory leak."
    }
];

// CSS styl pro oddělovače variant (přidá se automaticky při spuštění)
const style = document.createElement('style');
style.innerHTML = `
    .variant-separator {
        font-size: 1.8em;
        color: #1a73e8;
        margin: 50px 0 20px 0;
        border-bottom: 3px solid #1a73e8;
        padding-bottom: 8px;
        text-transform: uppercase;
        font-weight: bold;
    }
`;
document.head.appendChild(style);

function init() {
    const area = document.getElementById('content-area');
    area.innerHTML = ""; // Vyčištění plochy pro zamezení dvojitého vykreslení
    
    let renderedVariants = new Set();
    let lastAuthor = "";

    topics.forEach((t, i) => {
        // Generování velkého nadpisu při změně varianty
        if (t.author !== lastAuthor) {
            let separator = document.createElement('h1');
            separator.className = 'variant-separator';
            
            let jmenoSekce = t.author.replace('_', ' ');
            if (t.author === 'neznama_varianta') jmenoSekce = "Neznámá varianta z textu";
            
            separator.innerText = jmenoSekce;
            area.appendChild(separator);
            lastAuthor = t.author;
        }

        let card = document.createElement('div');
        card.className = `study-card ${t.author}`;
        card.id = `topic-${i}`;
        
        // Atribut pro zacílení scrollování z bočního menu na první otázku varianty
        if (!renderedVariants.has(t.author)) {
            card.setAttribute('data-variant-first', t.author);
            renderedVariants.add(t.author);
        }

        card.innerHTML = `
            <span class="category-label ${t.author}">Okruh: ${t.author.toUpperCase().replace('_', ' ')}</span>
            <h2>${t.title}</h2>
            <ul class="key-points">
                ${t.points.map(p => `<li>${p}</li>`).join('')}
            </ul>
            <div class="expert-tip">
                <strong>💡 Tip ke zkoušení:</strong> ${t.tip}
            </div>
        `;
        area.appendChild(card);
    });
}

function scrollToVariant(variantName) {
    const targetElement = document.querySelector(`[data-variant-first="${variantName}"]`);
    if (targetElement) {
        targetElement.scrollIntoView({behavior: 'smooth'});
    }
}

// Spuštění inicializace po načtení DOMu
window.addEventListener('DOMContentLoaded', init);
</script>
